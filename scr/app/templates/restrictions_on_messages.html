{% extends "base.html" %}
{% block title %}👤 Количество участников{% endblock %}
{% block content %}
</br>
<h3>👤 Количество участников</h3>

<label for="group-select">Выберите группу:</label>
<select id="group-select">
    <option value="">-- Загрузка... --</option>
</select>

<!-- скрытое поле для user_id -->
<input type="hidden" id="user-id-field"/>

<button onclick="getParticipants()">Получить количество участников</button>
<p id="participants-count" class="status"></p>

<!--Кнопка назад в начальное меню-->
<div>
    <a href="/">
        <button type="button" class="button">Назад в админ-панель</button>
    </a>
</div>

<script>
    const tg = window.Telegram.WebApp;

    document.addEventListener("DOMContentLoaded", () => {
        tg.expand();
        tg.BackButton.show();

        tg.BackButton.onClick(() => {
            tg.expand();
            setTimeout(() => window.history.back(), 0);
        });

        const user = tg.initDataUnsafe?.user || {};
        const user_id = user.id;

        if (!user_id) {
            console.error("user_id не получен из Telegram WebApp");
            return;
        }

        // Устанавливаем user_id в скрытое поле
        document.getElementById("user-id-field").value = user_id;

        // Сохраняем глобально (если нужно)
        window.TELEGRAM_USER_ID = user_id;

        // Загружаем список групп пользователя
        populateSelect(`/chat_title?user_id=${user_id}`, "group-select");
    });

    // Заполняем select группами
    function populateSelect(url, selectId) {
        fetch(url)
            .then((response) => response.json())
            .then((data) => {
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">-- Выберите группу --</option>';
            const groups = data.chat_title || data.groups || [];
            groups.forEach((group) => {
                const option = document.createElement("option");
                option.value = group.chat_title;
                option.textContent = group.chat_title;
                select.appendChild(option);
            });
        })
            .catch((err) => console.error(`Ошибка загрузки групп:`, err));
    }

    // Получаем количество участников
    async function getParticipants() {
        const chat_title = document.getElementById("group-select").value.trim();
        if (!chat_title) {
            alert("Выберите группу из списка");
            return;
        }

        try {
            const response = await fetch(
                `/update-participants?chat_title=${encodeURIComponent(chat_title)}`
            );
            const data = await response.json();
            const statusEl = document.getElementById("participants-count");
            
            console.log("Ответ сервера:", data);

            if (data.success) {
                statusEl.innerText = `Участников: ${data.participants_count}`;
                statusEl.className = "status success";
            } else {
                console.log("Ошибка от сервера:", data.error);
                statusEl.innerText = data.error || "Ошибка получения данных";
                statusEl.className = "status error";
            }
        } catch (error) {
            console.error("Ошибка сети:", error);
            const statusEl = document.getElementById("participants-count");
            statusEl.innerText = "Не удалось получить количество участников";
            statusEl.className = "status error";
        }
    }
</script>

{% endblock %}
